[package]
name = "agent-guard"
version = "0.1.0"
edition = "2021"
description = "A zero-trust runtime for AI agents: deny-by-default policy engine and an Ed25519-signed, hash-chained audit log."
license = "MIT"

[lib]
name = "agent_guard"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
ed25519-dalek = "2"
